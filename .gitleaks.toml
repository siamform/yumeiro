# gitleaks configuration for Yumeiro.
# Uses the default rule set and only silences paths that hold THIRD-PARTY data we mirror verbatim
# (public IPTV playlists whose stream URLs embed the upstream provider's own query tokens).
# Our own code, workflows and config are always scanned.

title = "yumeiro"

[extend]
useDefault = true

[[allowlists]]
description = "Mirrored third-party playlists (market/streams branches) - not Yumeiro secrets"
paths = [
  '''(^|/)playlists/[^/]+\.m3u8?$''',
  # Yumeiro Live state on the streams branch. The first file (commit 2d8cf9a6) was keyed by the
  # same third-party stream links as the playlist; since state version 2 the keys are hashes.
  '''^live/state\.json$''',
]

# Saved third-party web pages used as parser fixtures. Commit 7df5564 kept the site's public ad-slot
# placement ids (data-ad-key, visible in every visitor's page source); they were replaced with a
# placeholder afterwards. Scoped to that attribute in those fixture files only.
[[allowlists]]
description = "Public ad-slot ids in saved third-party drama pages (test fixtures)"
condition = "AND"
regexTarget = "match"
paths = [
  '''^app/src/test/resources/drama/[^/]+\.html$''',
]
regexes = [
  '''data-ad-key="[0-9a-f]{32}"''',
]

# SEC-LFM test fixtures (2026-11-19): two commits put a fake 32-hex Last.fm signature in test mocks
# (a hash of the public test secret "s", not a credential). The files were changed to a low-entropy
# fake in the next commit; only these two commits, only these two test files, only that match.
[[allowlists]]
description = "Fake api_sig in SEC-LFM test mocks (commits 1bbce9186e7cfb7fee34c0955380f81e5e6212ea, b57e1559bab8ca48fc631fba71e7bf5e4610231b)"
condition = "AND"
commits = ["1bbce9186e7cfb7fee34c0955380f81e5e6212ea", "b57e1559bab8ca48fc631fba71e7bf5e4610231b"]
paths = [
  '''^app/src/(test|androidTest)/java/dev/asfakul/yumeiro/(scrobble/LastFmCloudSignTest|ScrobbleFlushDeviceTest)\.kt$''',
]
