name: Review APK

# Final test §11: build the 1.9.0 release-candidate APKs for the owner's review, signed with the
# constant release key. Called only from ci.yml (manual run with review_apk=true) after that run's
# build, unit tests, lint and secret scan passed on the same commit. Nothing is tagged, released,
# published or pushed: the APKs are a workflow artifact (kept 30 days) for the owner to download.
on:
  workflow_call:

permissions:
  contents: read

env:
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21.0.13" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Restore constant release keystore
        env:
          MT_KEYSTORE_BASE64: ${{ secrets.MT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MT_KEYSTORE_BASE64" ]; then echo "::error::MT_KEYSTORE_BASE64 secret is missing. Refusing to sign with a random key."; exit 1; fi
          umask 077
          printf '%s' "$MT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs (same inputs as release.yml)
        env:
          MT_KEYSTORE_PASSWORD: ${{ secrets.MT_KEYSTORE_PASSWORD }}
          MT_KEY_ALIAS: ${{ secrets.MT_KEY_ALIAS }}
          MT_KEY_PASSWORD: ${{ secrets.MT_KEY_PASSWORD }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LRCLIB_APP_ID: ${{ secrets.LRCLIB_APP_ID }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          YUMEIRO_FCM_PROJECT_ID: ${{ secrets.YUMEIRO_FCM_PROJECT_ID }}
          YUMEIRO_FCM_SENDER_ID: ${{ secrets.YUMEIRO_FCM_SENDER_ID }}
          YUMEIRO_FCM_API_KEY: ${{ secrets.YUMEIRO_FCM_API_KEY }}
          YUMEIRO_FCM_APP_ID: ${{ secrets.YUMEIRO_FCM_APP_ID }}
          MT_UPDATER_TOKEN: ${{ github.event.repository.private && secrets.MT_UPDATER_TOKEN || '' }}
        run: ./gradlew --no-configuration-cache --no-build-cache assembleMobileRelease assembleTvRelease

      - name: Remove keystore from the runner
        if: always()
        run: |
          if [ -n "${MT_KEYSTORE_PATH:-}" ] && [ -f "$MT_KEYSTORE_PATH" ]; then
            shred -u "$MT_KEYSTORE_PATH" 2>/dev/null || rm -f "$MT_KEYSTORE_PATH"
          fi
          echo "MT_KEYSTORE_PATH=" >> "$GITHUB_ENV"

      - name: Verify, name and checksum
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          V=$(sed -n 's/^VERSION_NAME=//p' version.properties)
          H=$(git rev-parse --short=7 HEAD)
          EXPECTED=$(tr -d '[:space:]' < .github/release-signing-cert.sha256)
          mkdir -p review
          SRC=$(ls app/build/outputs/apk/mobile/release/*.apk | grep -v unsigned | head -1)
          TV=$(ls app/build/outputs/apk/tv/release/*.apk | grep -v unsigned | head -1)
          cp "$SRC" "review/yumeiro-$V-$H-review.apk"
          cp "$TV" "review/yumeiro-tv-$V-$H-review.apk"
          for F in review/*.apk; do
            echo "== $F"
            "$BT/apksigner" verify --verbose --print-certs "$F" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" | tee -a review/INTEGRITY.txt
            D=$("$BT/apksigner" verify --print-certs "$F" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            [ "$D" = "$EXPECTED" ] || { echo "::error::$F is not signed with the release certificate"; exit 1; }
            if "$BT/aapt2" dump badging "$F" | grep -q "application-debuggable"; then echo "::error::$F is debuggable"; exit 1; fi
            "$BT/aapt2" dump badging "$F" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" | tee -a review/INTEGRITY.txt
            for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
              python3 -c "import sys,zipfile; n=zipfile.ZipFile(sys.argv[1]).namelist(); sys.exit(0 if any(x.startswith('lib/'+sys.argv[2]+'/') for x in n) else 1)" "$F" "$ABI" \
                || { echo "::error::$F has no lib/$ABI"; exit 1; }
            done
            # R8 ran (X10-1): the mapping file exists and app classes are renamed in the dex.
            echo "dex files: $(python3 -c "import sys,zipfile; print(sum(1 for x in zipfile.ZipFile(sys.argv[1]).namelist() if x.endswith('.dex')))" "$F")" | tee -a review/INTEGRITY.txt
          done
          ls app/build/outputs/mapping/mobileRelease/mapping.txt app/build/outputs/mapping/tvRelease/mapping.txt | tee -a review/INTEGRITY.txt
          echo "commit $GITHUB_SHA ci_run $GITHUB_RUN_ID" >> review/INTEGRITY.txt
          (cd review && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Dex register budget (FINAL-49, ART verifier safety)
        run: |
          # R8 gave VideoPlayerModalContent invalid register types at 255/262 registers and ART
          # rejected the class (the 1.9.0 player crashed on open). No method of ours may pass 224.
          python3 -m pip install --quiet "androguard==4.1.4"
          for F in review/*.apk; do python3 scripts/dex_register_budget.py "$F" 224; done

      - name: Upload review APKs (artifact only, not published)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yumeiro-review-apk
          path: review/
          retention-days: 30
