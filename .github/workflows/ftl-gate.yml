# GATE-1-FTL: the GATE-1 walk (GateOneFtlSuite) on real phones in Firebase Test Lab, project yumeiro-ab29e.
# Manual only (workflow_dispatch). Spark quota: 5 physical-device runs a day; each device x variant is one
# run, so the default (2 phones x current + baseline) uses 4. Needs repo secret FIREBASE_SERVICE_ACCOUNT_JSON
# with the Editor role (or Firebase Test Lab Admin + Storage Object Admin) and the Cloud Testing API and
# Cloud Tool Results API enabled (https://firebase.google.com/docs/test-lab/android/continuous).
# The key is written to $RUNNER_TEMP, never printed, and deleted at the end.
name: FTL gate

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Test Lab devices, ';'-separated 'model=X,version=Y'. 'auto' = one budget phone + one Pixel from the catalog"
        default: "auto"
      variants:
        description: "current, baseline (GATE-1 fixes off) or both"
        default: "both"
        type: choice
        options: [both, current, baseline]
      targets:
        description: "Test Lab --test-targets (default: the GATE-1 walk). Example: class dev.asfakul.yumeiro.GroupB17SplashDeviceTest#b_rendersAtSixtyFps"
        default: "class dev.asfakul.yumeiro.GateOneFtlSuite"

concurrency:
  group: ftl-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ftl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21.0.13" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build APKs
        env:
          YUMEIRO_TG_API_ID: ${{ secrets.YUMEIRO_TG_API_ID }}
          YUMEIRO_TG_API_HASH: ${{ secrets.YUMEIRO_TG_API_HASH }}
        run: ./gradlew --no-daemon assembleMobileDebug assembleMobileDebugAndroidTest
      - name: Google Cloud CLI
        run: |
          if ! command -v gcloud > /dev/null; then
            curl -sSL https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/google-cloud-sdk/bin" >> "$GITHUB_PATH"
          fi
      - name: Sign in (service account)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$SA" || { echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set"; exit 1; }
          umask 077; printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          gcloud config set project yumeiro-ab29e --quiet
      - name: Run the gate in Test Lab
        env:
          MODELS: ${{ inputs.models }}
          VARIANTS: ${{ inputs.variants }}
          TARGETS: ${{ inputs.targets }}
        run: bash scripts/ftl-gate.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ftl-gate
          path: ftl/
      - name: Sign out
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"; gcloud auth revoke --all --quiet > /dev/null 2>&1 || true
