name: CI

# Fast feedback for pull requests and feature branches: debug build, unit tests and lint.
# Releases are produced only by release.yml on main.

# Never use pull_request_target here: fork PRs run with a read-only token and no secrets.
# Runs once per pull request (not again for the branch push) to avoid duplicate runs.
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      review_apk:
        description: "Final test §11: after build, tests, lint and the secret scan pass, build the signed review APKs (artifact only, never published)"
        type: boolean
        default: false
      abi_splits:
        description: "E3 / ADR-054: also build with -Pyumeiro.abiSplits=true and check the per-processor APKs"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # E2 / ADR-055: data-script unit tests first (seconds, no Gradle needed).
      - name: Data script tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Link-chain script on saved shortener pages (ADCHAIN-1)
        run: |
          (cd /tmp && npm i --no-save --silent jsdom@24 >/dev/null)
          NODE_PATH=/tmp/node_modules node scripts/adchain1_link_chain_check.js 2>/dev/null

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21.0.13" # pinned for reproducible builds

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 1.7.0: two apps, Yumeiro (phone, flavor "mobile") and Yumeiro TV (flavor "tv").
      - name: Assemble debug APKs (phone and TV)
        run: ./gradlew assembleMobileDebug assembleTvDebug

      # E3 / ADR-054 (dispatch input abi_splits): per-processor APKs plus the universal one.
      - name: ABI-split APKs check
        if: ${{ inputs.abi_splits }}
        run: |
          rm -rf app/build/outputs/apk/mobile/debug app/build/outputs/apk/tv/debug
          ./gradlew assembleMobileDebug assembleTvDebug -Pyumeiro.abiSplits=true
          export AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"
          python3 scripts/check_abi_splits.py app/build/outputs/apk/mobile/debug app/build/outputs/apk/tv/debug

      # Device tests are only built by the slow emulator workflow; compile them here so an
      # androidTest compile error (device run 43884803041) fails in minutes, not after a queue.
      - name: Compile device tests (phone app)
        run: ./gradlew compileMobileDebugAndroidTestKotlin

      # CI 45041431667: 194 Robolectric classes failed only because the android-all jar download
      # from Maven Central broke (IOException in MavenArtifactFetcher). Robolectric keeps those jars
      # in ~/.m2, so cache them; a network blip then cannot fail the unit tests again.
      - name: Cache Robolectric Android jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Unit tests (phone app, all shared code)
        run: ./gradlew testMobileDebugUnitTest

      - name: Unit tests (TV app, TV-only behaviour)
        run: ./gradlew testTvDebugUnitTest --tests 'dev.asfakul.yumeiro.EditionTest' --tests 'dev.asfakul.yumeiro.update.*' --tests 'dev.asfakul.yumeiro.compat.*'

      # Lint is blocking since CI 43757542521 (0 errors on both apps, X10-4).
      - name: Lint
        run: ./gradlew lintMobileDebug

      # G12 X10: the TV app has minSdk 24 (phone: 28), so only this pass catches NewApi calls
      # that would crash older Android TV boxes.
      - name: Lint (TV app, minSdk 24)
        # Runs even when the phone lint failed, so both reports reach the summary.
        if: success() || failure()
        run: ./gradlew lintTvDebug

      - name: Lint errors to the job summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          for v in ("mobileDebug", "tvDebug"):
              f = f"app/build/reports/lint-results-{v}.xml"
              if not os.path.exists(f):
                  print(f"### LINT {v}: report missing"); continue
              errs = [i for i in ET.parse(f).getroot().iter("issue") if i.get("severity") in ("Error", "Fatal")]
              print(f"### LINT {v}: {len(errs)} errors")
              for i in errs[:80]:
                  loc = i.find("location")
                  path = (loc.get("file", "") if loc is not None else "").split("/app/", 1)[-1]
                  line = loc.get("line", "") if loc is not None else ""
                  print(f"- {i.get('id')} app/{path}:{line} {i.get('message', '')[:160]}")
          PY

      - name: Version scripts dry-run
        run: |
          git fetch --tags --force --unshallow 2>/dev/null || git fetch --tags --force
          cp version.properties /tmp/version.properties.bak
          bash .github/scripts/compute-version.sh
          cp /tmp/version.properties.bak version.properties

      - name: Data-branch workflows (NBUG-16 shell test)
        if: ${{ !cancelled() }}
        run: bash .github/scripts/tests/data-branch-test.sh

      - name: Market logos and categories (NBUG-14 Python test)
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/tests/test_build_market_logos.py

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Yumeiro-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz
      - name: Scan history and tree (values redacted)
        run: |
          ./gitleaks git --redact --no-banner -c .gitleaks.toml .
          ./gitleaks dir --redact --no-banner -c .gitleaks.toml .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  review-apk:
    name: Review APK (signed, not published)
    needs: [build, secrets-scan]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.review_apk }}
    uses: ./.github/workflows/review-apk.yml
    secrets: inherit
