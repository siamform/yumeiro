name: CI

# Fast feedback for pull requests and feature branches: debug build, unit tests and lint.
# Releases are produced only by release.yml on main.

# Never use pull_request_target here: fork PRs run with a read-only token and no secrets.
# Runs once per pull request (not again for the branch push) to avoid duplicate runs.
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21.0.13" # pinned for reproducible builds

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 1.7.0: two apps, Yumeiro (phone, flavor "mobile") and Yumeiro TV (flavor "tv").
      - name: Assemble debug APKs (phone and TV)
        run: ./gradlew assembleMobileDebug assembleTvDebug

      - name: Unit tests (phone app, all shared code)
        run: ./gradlew testMobileDebugUnitTest

      - name: Unit tests (TV app, TV-only behaviour)
        run: ./gradlew testTvDebugUnitTest --tests 'dev.asfakul.yumeiro.EditionTest' --tests 'dev.asfakul.yumeiro.update.*'

      - name: Lint
        run: ./gradlew lintMobileDebug
        continue-on-error: true

      - name: Version scripts dry-run
        run: |
          git fetch --tags --force --unshallow 2>/dev/null || git fetch --tags --force
          cp version.properties /tmp/version.properties.bak
          bash .github/scripts/compute-version.sh
          cp /tmp/version.properties.bak version.properties

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Yumeiro-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz
      - name: Scan history and tree (values redacted)
        run: |
          ./gitleaks git --redact --no-banner -c .gitleaks.toml .
          ./gitleaks dir --redact --no-banner -c .gitleaks.toml .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
