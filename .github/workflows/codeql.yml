name: CodeQL

# Static analysis for the Kotlin/Java app and for the workflows themselves.
on:
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  # Baseline for the PR gate. Code scanning compares a PR's alerts with the latest analysis of `main`;
  # with only the monthly run that baseline was weeks old, so alerts already on `main` (or fixed there)
  # showed up as "new" on the next PR that touched those lines (PR #17). One run per merged code change.
  push:
    branches: [main]
    paths: ["app/**", "extension-kit/**", ".github/workflows/**", ".github/codeql/**", "*.gradle.kts", "gradle/**"]
  schedule:
    - cron: "17 3 1 * *" # 1st of every month, 09:17 Asia/Dhaka
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload results to code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21.0.13"
      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: matrix.build-mode == 'manual'
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache assembleDebug
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif-results
      # Drop only the reviewed rule+path pairs in .github/codeql/suppressions.jq, then upload.
      - name: Apply reviewed suppressions
        run: |
          for f in sarif-results/*.sarif; do
            jq -f .github/codeql/suppressions.jq "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif-results
          category: /language:${{ matrix.language }}
