name: Release

# Every push to main produces a new signed release:
#   1. compute the next version (auto-bump if the developer didn't)
#   2. build the APK signed with the CONSTANT release keystore
#   3. verify the signing certificate matches the expected fingerprint
#   4. commit the bumped version.properties back to main ("[skip ci]")
#   5. tag + publish a GitHub Release with commit-based notes and
#      release-Yumeiro-v<version>.apk (GitHub adds the source .zip / .tar.gz automatically)

on:
  push:
    branches: [main]
    # Only app changes ship a release; docs, data sources and workflow edits don't.
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/release-signing-cert.sha256"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = from Conventional Commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read # default for every job; the publishing job opts in below

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: Yumeiro
  # Reproducibility: fixed timezone and locale for anything that embeds dates.
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  release:
    name: Build & publish release
    permissions:
      contents: write # version bump, release tag and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout (full history for tags & changelog)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21.0.13" # pinned for reproducible builds

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Compute version
        id: version
        env:
          BUMP_OVERRIDE: ${{ github.event.inputs.bump || 'auto' }}
        run: bash .github/scripts/compute-version.sh

      - name: Restore constant release keystore
        env:
          MT_KEYSTORE_BASE64: ${{ secrets.MT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MT_KEYSTORE_BASE64" ]; then
            echo "::error::MT_KEYSTORE_BASE64 secret is missing. Refusing to sign with a random key."
            exit 1
          fi
          umask 077
          printf '%s' "$MT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          MT_KEYSTORE_PASSWORD: ${{ secrets.MT_KEYSTORE_PASSWORD }}
          MT_KEY_ALIAS: ${{ secrets.MT_KEY_ALIAS }}
          MT_KEY_PASSWORD: ${{ secrets.MT_KEY_PASSWORD }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MT_UPDATER_TOKEN: ${{ secrets.MT_UPDATER_TOKEN }}
        # --no-build-cache: the signed artifact is always built from source, never from cache entries.
        run: ./gradlew --no-configuration-cache --no-build-cache assembleRelease testDebugUnitTest

      - name: Remove keystore from the runner
        if: always()
        run: |
          if [ -n "${MT_KEYSTORE_PATH:-}" ] && [ -f "$MT_KEYSTORE_PATH" ]; then
            shred -u "$MT_KEYSTORE_PATH" 2>/dev/null || rm -f "$MT_KEYSTORE_PATH"
          fi
          echo "MT_KEYSTORE_PATH=" >> "$GITHUB_ENV"

      - name: Verify signature & rename APK
        id: apk
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SRC=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          if [ -z "$SRC" ]; then echo "::error::No signed APK produced"; exit 1; fi

          ACTUAL=$("$BT/apksigner" verify --print-certs "$SRC" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          EXPECTED=$(tr -d '[:space:]' < .github/release-signing-cert.sha256)
          echo "Signing cert: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is not signed with the constant release key (expected $EXPECTED)"
            exit 1
          fi

          NAME="release-${APP_NAME}-v${{ steps.version.outputs.version_name }}.apk"
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          SHA=$(sha256sum "dist/$NAME" | awk '{print $1}')
          (cd dist && sha256sum "$NAME" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          # Release builds must never be debuggable.
          if "$BT/aapt2" dump badging "dist/$NAME" | grep -q "application-debuggable"; then
            echo "::error::Release APK is debuggable"; exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        id: commit
        if: steps.version.outputs.changed == 'true'
        run: |
          git add version.properties
          git commit -m "chore(release): v${{ steps.version.outputs.version_name }} [skip ci]"
          # Best effort: if main moved meanwhile, the tag still points at this commit and the
          # next run derives the version from the tag, so versions never go backwards.
          git push origin HEAD:main || echo "::notice::Version bump not pushed (main is protected or moved); the release tag carries the version."

      - name: Generate release notes
        run: |
          bash .github/scripts/release-notes.sh \
            "${{ steps.version.outputs.version_name }}" \
            "${{ steps.version.outputs.version_code }}" \
            "${{ steps.version.outputs.previous_tag }}" \
            "${{ steps.apk.outputs.name }}" \
            "${{ steps.apk.outputs.sha }}" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Tag & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag -a "$TAG" -m "Yumeiro $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            "dist/${{ steps.apk.outputs.name }}" \
            dist/SHA256SUMS.txt \
            --title "Yumeiro $TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag \
            --latest
