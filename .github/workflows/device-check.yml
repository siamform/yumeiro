name: Device check

# Runs the app on real Android emulators. R15: StabilityStressDeviceTest (tab/pager swipes, feed flings, D-pad focus
# traversal) on a low-RAM emulator (2 GB, 192 MB heap → the app's low-end path) and on a current
# Android image, while sampling the main thread for regex compilation and stalls. The report,
# logcat and (optionally) a heap dump are uploaded. PlayerSwitchDeviceTest checks quality switching,
# picture and sound. Manual only: emulators are expensive.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test class or method filter (empty = stress + player + playback tests)"
        required: false
        default: ""

concurrency:
  group: device-check-${{ github.ref }}-${{ inputs.test || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api33-lowram
            api: 33
            target: google_apis
            profile: pixel_3a
            ram: 2048M
            heap: 192M
          - name: api36
            api: 36
            target: google_apis
            profile: pixel_6
            ram: 4096M
            heap: 512M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21.0.13" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        run: ./gradlew --no-daemon assembleMobileDebug assembleMobileDebugAndroidTest
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          TEST_FILTER: ${{ github.event.inputs.test }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.ram }}
          heap-size: ${{ matrix.heap }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-check.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-check-${{ matrix.name }}
          path: |
            stress/
            logcat.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
      - name: Fail if tests failed
        run: test ! -f failed.txt
