name: Device check

# Runs the app on real Android emulators. R15: StabilityStressDeviceTest (tab/pager swipes, feed flings, D-pad focus
# traversal) on a low-RAM emulator (2 GB, 192 MB heap → the app's low-end path) and on a current
# Android image, while sampling the main thread for regex compilation and stalls. The report,
# logcat and (optionally) a heap dump are uploaded. PlayerSwitchDeviceTest checks quality switching,
# picture and sound. Manual only: emulators are expensive.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test class or method filter (empty = stress + player + playback tests)"
        required: false
        default: ""
      repeat:
        description: "Runs of each class per job, each from cleared app data (flake hunting)"
        required: false
        default: "1"
      shards:
        description: "Parallel jobs per device, as a JSON list, e.g. [1,2,3,4,5]"
        required: false
        default: "[1]"
      tv:
        description: "Run Yumeiro TV on an Android TV emulator (API 24, minSdk) instead of the two phones"
        type: boolean
        required: false
        default: false
      minsdk:
        description: "Run the phone app on its minSdk (API 28, Pixel 3a, 2 GB) instead of the two phones (G12 X13)"
        type: boolean
        required: false
        default: false
      bench:
        description: "G12 X2: run the Macrobenchmark workflow instead (startup or profile); none = device tests"
        type: choice
        options: [none, startup, profile]
        default: none
      phone:
        description: "Which phone emulators (EXT-T1: repeat campaigns on api33-lowram only, no wasted api36 jobs)"
        type: choice
        options: [both, api33-lowram, api36]
        default: both
      gpu:
        description: "ST-18: emulator graphics (GitHub runners have no GPU; these are the software paths to compare)"
        type: choice
        options: [swiftshader_indirect, swangle_indirect, guest]
        default: swiftshader_indirect
      hprof:
        description: "G12 X2: StabilityStress writes a heap dump (stress/end.hprof) at the end"
        type: boolean
        required: false
        default: false

concurrency:
  group: device-check-${{ github.ref }}-${{ inputs.test || 'full' }}-${{ inputs.repeat || '1' }}-${{ inputs.tv && 'tv' || (inputs.minsdk && 'minsdk' || 'phone') }}-${{ inputs.bench || 'none' }}-${{ inputs.gpu || 'swiftshader_indirect' }}-${{ inputs.phone || 'both' }}-${{ inputs.shards || '[1]' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    if: ${{ inputs.bench == 'startup' || inputs.bench == 'profile' }}
    uses: ./.github/workflows/macrobenchmark.yml
    with:
      what: ${{ inputs.bench }}

  emulator:
    if: ${{ !(inputs.bench == 'startup' || inputs.bench == 'profile') }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards || '[1]') }}
        # G12 X9: tv=true swaps the two phones for one Android TV box at the TV app's minSdk.
        device: ${{ fromJSON(inputs.tv && '[{"name":"tv-api24","api":24,"target":"android-tv","arch":"x86","profile":"tv_1080p","ram":"2048M","heap":"256M","flavor":"Tv"}]' || inputs.minsdk && '[{"name":"api28","api":28,"target":"google_apis","arch":"x86_64","profile":"pixel_3a","ram":"2048M","heap":"256M","flavor":"Mobile"}]' || inputs.phone == 'api33-lowram' && '[{"name":"api33-lowram","api":33,"target":"google_apis","arch":"x86_64","profile":"pixel_3a","ram":"2048M","heap":"192M","flavor":"Mobile"}]' || inputs.phone == 'api36' && '[{"name":"api36","api":36,"target":"google_apis","arch":"x86_64","profile":"pixel_6","ram":"4096M","heap":"512M","flavor":"Mobile"}]' || '[{"name":"api33-lowram","api":33,"target":"google_apis","arch":"x86_64","profile":"pixel_3a","ram":"2048M","heap":"192M","flavor":"Mobile"},{"name":"api36","api":36,"target":"google_apis","arch":"x86_64","profile":"pixel_6","ram":"4096M","heap":"512M","flavor":"Mobile"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21.0.13" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        run: ./gradlew --no-daemon assemble${{ matrix.device.flavor }}Debug assemble${{ matrix.device.flavor }}DebugAndroidTest
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          TEST_FILTER: ${{ github.event.inputs.test || (inputs.tv && 'dev.asfakul.yumeiro.HomeNavigationDeviceTest,dev.asfakul.yumeiro.BackNavigationDeviceTest,dev.asfakul.yumeiro.StabilityStressDeviceTest' || '') }}
          FLAVOR: ${{ matrix.device.flavor }}
          REPEAT: ${{ github.event.inputs.repeat || '1' }}
          HPROF: ${{ inputs.hprof && 'true' || 'false' }}
        with:
          api-level: ${{ matrix.device.api }}
          target: ${{ matrix.device.target }}
          arch: ${{ matrix.device.arch }}
          profile: ${{ matrix.device.profile }}
          ram-size: ${{ matrix.device.ram }}
          heap-size: ${{ matrix.device.heap }}
          disable-animations: true
          emulator-options: -no-window -gpu ${{ inputs.gpu || 'swiftshader_indirect' }} -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-check.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-check-${{ matrix.device.name }}-${{ matrix.shard }}
          path: |
            stress/
            logcat.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
      - name: Fail if tests failed
        run: test ! -f failed.txt
