version: 2
# Monthly and grouped: one PR per ecosystem keeps GitHub Actions usage low.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      # Robolectric 4.17 breaks every Robolectric unit test (IllegalAccessException in
      # AndroidInterceptors; re-checked 2026-11-15: 7/7 OnlineFeaturesTest fail). 4.18 passes
      # the full suite (855 tests) and is in use since R16.
      - dependency-name: "org.robolectric:robolectric"
        versions: ["[4.17,4.18)"]
      # jackson-module-kotlin 2.20+ calls MethodHandle.invokeExact, which D8 rejects below minSdk 26.
      # The app supports Android 7 (minSdk 24); CloudStream only needs 2.13.
      - dependency-name: "com.fasterxml.jackson.module:jackson-module-kotlin"
        versions: ["[2.19,)"]
      # Owner decision: the phone build stays on Jackson 2.18.11 (WsFBugBatch1Test pins it; PR #36
      # with 2.19.4 failed CI run 44694883991 and was closed 2026-11-20).
  # Server dev tools (wrangler pulls in miniflare → undici / sharp). Updating wrangler as a group fixes
  # transitive alerts that per-package security updates can't. Nothing here ships in the Worker bundle.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      server:
        patterns: ["*"]
