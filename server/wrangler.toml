# Yumeiro Cloud: one free Cloudflare Worker. See server/README.md for setup.
name = "yumeiro-cloud"
main = "src/index.ts"
compatibility_date = "2026-05-01"

routes = [{ pattern = "api.yumeiro.click", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "yumeiro"
database_id = "beb118e1-ba0e-4b6b-84d8-d76b42037d7c" # not a secret; forks: `npx wrangler d1 create yumeiro`

[[queues.producers]]
binding = "WAKES"
queue = "yumeiro-wakes"

[[queues.consumers]]
queue = "yumeiro-wakes"
max_batch_size = 1  # one message = up to 40 pushes, under the 50-subrequest limit
max_batch_timeout = 5
max_retries = 0

# Free per-IP limit for registrations that create a new device (see index.ts). Refreshes are not limited.
[[ratelimits]]
name = "NEW_DEVICES"
namespace_id = "7001"
simple = { limit = 5, period = 60 }

# Per-device limit on check-ins (keyed by device id, not IP).
[[ratelimits]]
name = "DEVICE_SYNC"
namespace_id = "7002"
simple = { limit = 3, period = 60 }

# SEC-LFM (ADR-048): per-IP limit on Last.fm signatures (now playing + scrobble + sign-in polls).
[[ratelimits]]
name = "LASTFM_SIGN"
namespace_id = "7003"
simple = { limit = 30, period = 60 }

# E1-A: per-IP limit on Yumeiro Hub catalog calls that miss the edge cache.
[[ratelimits]]
name = "HUB"
namespace_id = "7004"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "BLACKSOURCE"
namespace_id = "7005"
simple = { limit = 30, period = 60 }  # F14: AniList allows ~90 calls/min per server IP; the edge cache absorbs repeats

# LASTFM_API_KEY and LASTFM_SHARED_SECRET are Worker secrets (scripts/deploy-worker.sh puts them from .env). TMDB_TOKEN too (E1-A).

[triggers]
# Every 10 minutes: episodes that just aired on AniList. the 03:00 UTC run also prunes silent devices.
crons = ["*/10 * * * *"]

[observability]
enabled = false
