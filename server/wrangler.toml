# Yumeiro Cloud: one free Cloudflare Worker. See server/README.md for setup.
name = "yumeiro-cloud"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Uncomment once yumeiro.click is on Cloudflare DNS.
# routes = [{ pattern = "api.yumeiro.click", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "yumeiro"
database_id = "REPLACE_WITH_D1_ID" # printed by `npx wrangler d1 create yumeiro`

[[queues.producers]]
binding = "WAKES"
queue = "yumeiro-wakes"

[[queues.consumers]]
queue = "yumeiro-wakes"
max_batch_size = 1  # one message = up to 40 pushes, under the 50-subrequest limit
max_batch_timeout = 5
max_retries = 0

[triggers]
# Every 10 minutes: episodes that just aired on AniList. the 03:00 UTC run also prunes silent devices.
crons = ["*/10 * * * *"]

[observability]
enabled = false
